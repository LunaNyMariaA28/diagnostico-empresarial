<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diagnóstico empresarial para tu empresa</title>
<meta name="description" content="Evalúa la madurez de tu empresa en 6 áreas y recibe un informe con fortalezas, debilidades y plan de acción.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F3;--surface:#FFFFFF;--ink:#16221E;--muted:#58675F;--line:#D3DCD7;
  --primary:#1D5C4D;--primary-ink:#FFFFFF;--primary-soft:#E1EEE9;
  --l1:#B3412F;--l2:#CF7428;--l3:#B8961A;--l4:#4F9446;--l5:#1D5C4D;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1614;--surface:#17211E;--ink:#E4ECE8;--muted:#9BAAA3;--line:#2B3934;
    --primary:#72C3A8;--primary-ink:#0D1513;--primary-soft:#1E302A;
    --l1:#E46C57;--l2:#EE9A4E;--l3:#DDBF4B;--l4:#7DC06F;--l5:#72C3A8;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1614;--surface:#17211E;--ink:#E4ECE8;--muted:#9BAAA3;--line:#2B3934;
  --primary:#72C3A8;--primary-ink:#0D1513;--primary-soft:#1E302A;
  --l1:#E46C57;--l2:#EE9A4E;--l3:#DDBF4B;--l4:#7DC06F;--l5:#72C3A8;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;margin:0}
h1{font-size:clamp(1.9rem,5vw,2.8rem);letter-spacing:-.01em}
h2{font-size:1.45rem}
h3{font-size:1.1rem;font-weight:500}
p{margin:0}
.wrap{max-width:860px;margin:0 auto;padding:24px 18px 64px}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.btn{border:1.5px solid var(--primary);background:var(--primary);color:var(--primary-ink);padding:11px 20px;border-radius:10px;font-weight:600}
.btn.ghost{background:transparent;color:var(--primary)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}

/* Inicio */
.intro{display:grid;gap:22px;margin-top:8px}
.intro .lead{font-size:1.1rem;max-width:62ch}
.hexline{display:flex;gap:6px;flex-wrap:wrap}
.hexline span{font-size:.92rem;padding:4px 10px;border-radius:999px;background:var(--primary-soft);color:var(--ink)}
.form{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.form label{display:grid;gap:5px;font-weight:600;font-size:.95rem}
.form .full{grid-column:1/-1}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;width:100%}
@media (max-width:600px){.form{grid-template-columns:1fr}}

/* Cuestionario */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.step{border:0;background:transparent;padding:0;text-align:left;color:var(--muted);font-size:.78rem;display:grid;gap:5px}
.step .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.step .bar i{display:block;height:100%;background:var(--primary);width:0}
.step.on{color:var(--ink);font-weight:700}
.step .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.areahead{margin:26px 0 6px;display:grid;gap:6px}
.scale-legend{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin:14px 0 4px}
.sub{margin-top:26px}
.sub h3{color:var(--primary);margin-bottom:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:10px}
.item p{margin-bottom:12px}
.item .num{color:var(--muted);font-weight:600;margin-right:6px}
.likert{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.likert button{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:9px 0;font-weight:700;font-size:1.05rem}
.likert button[aria-checked="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.item .chosen{font-size:.88rem;color:var(--muted);margin-top:8px;min-height:1.3em}
.item.disabled{opacity:.45}
.na{display:flex;gap:10px;align-items:flex-start;background:var(--primary-soft);border-radius:12px;padding:14px;margin-top:14px}
.na input{width:22px;height:22px;flex:none;margin-top:2px}
.navbar{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}
.pending{font-size:.95rem;color:var(--l1);margin-top:12px}

/* Resultados */
.reshead{display:grid;gap:6px;margin:6px 0 20px}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:center}
@media (max-width:700px){.hero{grid-template-columns:1fr}}
.radar svg{width:100%;height:auto;display:block}
.level{display:grid;gap:10px}
.level .score{font-family:var(--display);font-size:3.2rem;line-height:1}
.level .score small{font-size:1.1rem;color:var(--muted);font-family:var(--body)}
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.ladder div{height:10px;border-radius:3px;background:var(--line)}
.ladder-labels{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:.72rem;color:var(--muted)}
.tag{display:inline-block;font-weight:700;padding:3px 10px;border-radius:999px;color:#fff;font-size:.9rem}
section.block{margin-top:30px}
section.block>h2{margin-bottom:12px}
.arearow{display:grid;grid-template-columns:150px 1fr 54px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.arearow:last-child{border-bottom:0}
.track{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:6px}
.val{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:520px){.arearow{grid-template-columns:1fr 54px}.arearow .track{grid-column:1/-1;grid-row:2}}
details.areadet{border-bottom:1px solid var(--line);padding:10px 0}
details.areadet summary{cursor:pointer;font-weight:700;display:flex;justify-content:space-between;gap:10px}
.subrow{display:grid;grid-template-columns:1fr 110px 44px;gap:10px;align-items:center;font-size:.95rem;padding:6px 0}
.subrow .track{height:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:700px){.two{grid-template-columns:1fr}}
.two ul{margin:8px 0 0;padding-left:20px}
.two li{margin-bottom:6px}
.plan{display:grid;gap:10px}
.planitem{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--l1);border-radius:10px;padding:14px 16px;display:grid;gap:4px}
.planitem .ph{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700}
.ai-out{white-space:pre-wrap;margin-top:12px}
.note{font-size:.88rem;color:var(--muted);margin-top:8px}
.actions{margin-top:30px;display:flex;gap:10px;flex-wrap:wrap}
.ready{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:var(--primary-soft);border-radius:14px;padding:16px 18px;margin:0 0 18px}
.ready p{font-weight:600}
.confirm{display:none;gap:8px;align-items:center;flex-wrap:wrap}
.confirm.show{display:flex}
@media (prefers-reduced-motion:no-preference){.track i{transition:width .6s ease}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>

<script>
(function(){
"use strict";

/* ---------- Banco de preguntas ---------- */
const AREAS = [
 {id:"fin",name:"Financiera",subs:[
  {name:"Información financiera",items:["La empresa cuenta con estados financieros actualizados que se elaboran de forma periódica.","La empresa compara periódicamente sus resultados reales frente a un presupuesto definido."],rec:"Implementar un cierre contable mensual con estado de resultados, balance general y flujo de efectivo, y construir un presupuesto anual con comparación mensual entre lo real y lo presupuestado."},
  {name:"Liquidez",items:["La empresa hace seguimiento periódico a sus indicadores de liquidez (razón corriente, prueba ácida, capital de trabajo).","La empresa dispone del efectivo suficiente para cubrir sus obligaciones de corto plazo."],rec:"Elaborar un flujo de caja proyectado a 13 semanas, definir un saldo mínimo de efectivo y calcular cada mes la razón corriente, la prueba ácida y el capital de trabajo."},
  {name:"Rentabilidad",items:["La empresa calcula y analiza periódicamente sus márgenes de rentabilidad (bruto, operativo y neto).","La empresa evalúa el retorno que generan sus activos y su patrimonio (ROA y ROE)."],rec:"Calcular mensualmente los márgenes bruto, operativo y neto por línea de producto o servicio, y revisar cada trimestre el ROA y el ROE para identificar qué genera valor."},
  {name:"Endeudamiento",items:["La empresa conoce con precisión su nivel de endeudamiento y la composición de sus obligaciones financieras.","La empresa evalúa su capacidad de pago antes de adquirir nueva deuda."],rec:"Consolidar un inventario de deudas (acreedor, saldo, tasa y plazo), fijar un tope de endeudamiento y evaluar la capacidad de pago antes de tomar nuevos créditos."},
  {name:"Gestión de recursos",items:["La empresa hace seguimiento a su ciclo de conversión de efectivo (rotación de cartera, inventarios y cuentas por pagar).","La empresa controla sus costos y gastos de manera sistemática."],rec:"Definir políticas de crédito y cobranza, negociar plazos con proveedores y monitorear cada mes el ciclo de conversión de efectivo y los costos y gastos frente al presupuesto."}
 ]},
 {id:"mkt",name:"Marketing",subs:[
  {name:"Mercado",items:["La empresa tiene claramente definido su mercado objetivo y los segmentos de clientes que atiende.","La empresa analiza periódicamente a sus competidores y las tendencias del mercado."],rec:"Definir el perfil del cliente ideal y sus segmentos, y realizar al menos una vez al año un análisis de competidores y tendencias del sector."},
  {name:"Producto o servicio",items:["La propuesta de valor de la empresa está definida y la diferencia claramente de la competencia.","La empresa revisa y ajusta su portafolio de productos o servicios según la evolución del mercado."],rec:"Formular por escrito la propuesta de valor, validarla con clientes y revisar el portafolio según ventas y margen para decidir qué mantener, mejorar o retirar."},
  {name:"Estrategia comercial",items:["La empresa establece metas de ventas periódicas y hace seguimiento a su cumplimiento.","La empresa cuenta con una estrategia de precios definida, sustentada en sus costos y en el mercado."],rec:"Fijar metas de ventas mensuales por canal o vendedor con seguimiento, y definir una política de precios que considere costos, competencia y valor percibido."},
  {name:"Clientes",items:["La empresa mide periódicamente la satisfacción de sus clientes.","La empresa aplica estrategias para fidelizar y retener a sus clientes."],rec:"Aplicar una encuesta corta de satisfacción (por ejemplo, NPS) después de cada compra y diseñar acciones de fidelización para los clientes más valiosos."},
  {name:"Marketing digital",items:["La empresa mantiene una presencia digital activa y planificada (página web, redes sociales, contenidos).","La empresa mide los resultados de sus acciones de marketing digital y los usa para ajustar su estrategia."],rec:"Construir un calendario de contenidos, mantener actualizados los canales digitales y medir alcance, conversiones y costo por cliente para ajustar la inversión."}
 ]},
 {id:"ops",name:"Operaciones y calidad",short:"Operaciones",subs:[
  {name:"Gestión de procesos",items:["Los procesos clave de la empresa están documentados y estandarizados.","Los procesos de la empresa cuentan con indicadores que permiten hacer seguimiento a sus resultados."],rec:"Levantar el mapa de procesos, documentar los procedimientos clave y asignar a cada proceso indicadores y un responsable."},
  {name:"Productividad",items:["La empresa conoce su capacidad instalada y el grado en que la utiliza.","La empresa identifica y corrige las ineficiencias de su operación (desperdicios, reprocesos, cuellos de botella)."],rec:"Medir la capacidad instalada y la utilizada, y aplicar herramientas de mejora como 5S y análisis de cuellos de botella para reducir desperdicios y reprocesos."},
  {name:"Inventarios y abastecimiento",items:["La empresa controla sus inventarios con niveles mínimos y máximos definidos.","La empresa evalúa periódicamente el desempeño de sus proveedores (calidad, precio y tiempos de entrega)."],rec:"Definir niveles mínimos, máximos y punto de reorden para los productos clave, y evaluar a los proveedores al menos dos veces al año."},
  {name:"Gestión de calidad",items:["La empresa tiene objetivos e indicadores de calidad definidos para sus productos o servicios.","La empresa implementa acciones correctivas y preventivas cuando detecta fallas de calidad."],rec:"Establecer objetivos e indicadores de calidad y un procedimiento de acciones correctivas y preventivas con registro y análisis de causas."},
  {name:"Entrega",items:["La empresa cumple con los tiempos y condiciones de entrega pactados con sus clientes.","La empresa registra y analiza las devoluciones y reclamos para mejorar su operación."],rec:"Medir el porcentaje de pedidos entregados a tiempo y completos, y analizar cada mes las devoluciones y reclamos para atacar sus causas."}
 ]},
 {id:"gh",name:"Gestión humana",subs:[
  {name:"Estructura y planeación",items:["La empresa tiene una estructura organizacional definida, con cargos y funciones documentados.","Cada empleado conoce con claridad sus responsabilidades dentro de la empresa."],rec:"Diseñar el organigrama y los perfiles de cargo con funciones y responsabilidades, y socializarlos con todo el equipo."},
  {name:"Selección y vinculación",items:["La empresa aplica un proceso formal de selección con criterios definidos para cada cargo.","Los nuevos empleados reciben un proceso de inducción estructurado."],rec:"Estandarizar el proceso de selección (perfil, entrevista, verificación de referencias) y diseñar un programa de inducción para nuevos empleados."},
  {name:"Capacitación y desempeño",items:["La empresa cuenta con un plan de capacitación basado en las necesidades de formación del personal.","La empresa evalúa periódicamente el desempeño de sus empleados."],rec:"Diagnosticar necesidades de formación, elaborar un plan anual de capacitación e implementar una evaluación de desempeño con retroalimentación."},
  {name:"Clima, cultura y bienestar",items:["La empresa mide periódicamente el clima laboral y la satisfacción de sus empleados.","La empresa cuenta con programas de bienestar, incentivos o reconocimiento para su personal."],rec:"Aplicar una medición anual de clima laboral y definir un plan de bienestar y reconocimiento a partir de sus resultados."},
  {name:"Indicadores de gestión humana",items:["La empresa mide indicadores de gestión humana como rotación, ausentismo y accidentalidad.","La empresa usa los indicadores de gestión humana para tomar decisiones sobre su personal."],rec:"Medir cada mes la rotación, el ausentismo y la accidentalidad, y revisarlos periódicamente para orientar decisiones sobre el personal."}
 ]},
 {id:"ce",name:"Comercio exterior",optional:true,subs:[
  {name:"Capacidad internacional",items:["La empresa tiene identificados productos o servicios con potencial para mercados internacionales.","La empresa cuenta con la capacidad productiva y financiera para atender mercados externos."],rec:"Identificar productos con potencial exportador y evaluar la capacidad productiva y financiera para atender demanda externa, apoyándose en programas de ProColombia o las cámaras de comercio."},
  {name:"Exportaciones",items:["La empresa conoce los requisitos técnicos, sanitarios y comerciales de sus mercados de destino.","La empresa realiza operaciones de exportación de forma regular y planificada."],rec:"Realizar estudios de los mercados objetivo, identificar sus requisitos de acceso y construir un plan exportador con metas."},
  {name:"Importaciones",items:["La empresa controla los costos asociados a sus importaciones (aranceles, fletes, trámites).","La empresa conoce su nivel de dependencia de proveedores e insumos extranjeros."],rec:"Calcular el costo total de importación (arancel, fletes, seguros y trámites) y diversificar proveedores para reducir la dependencia."},
  {name:"Logística internacional",items:["La empresa aplica correctamente los Incoterms en sus negociaciones internacionales.","La empresa gestiona adecuadamente los trámites aduaneros y la documentación de comercio exterior."],rec:"Capacitar al equipo en Incoterms y trámites aduaneros, y apoyarse en una agencia de aduanas u operador logístico confiable."},
  {name:"Riesgos internacionales",items:["La empresa gestiona el riesgo cambiario de sus operaciones internacionales.","La empresa tiene identificadas las barreras arancelarias y no arancelarias que afectan su negocio."],rec:"Definir una política de cobertura cambiaria y mapear las barreras arancelarias y no arancelarias de los mercados de interés."}
 ]},
 {id:"leg",name:"Legal",subs:[
  {name:"Formalización",items:["La empresa mantiene al día su registro mercantil, RUT, permisos y licencias de funcionamiento.","La empresa cumple oportunamente con sus obligaciones tributarias."],rec:"Crear un calendario de obligaciones (renovación de matrícula mercantil, declaraciones tributarias, permisos) con responsables y alertas."},
  {name:"Laboral",items:["Todos los empleados de la empresa tienen contrato formal y están afiliados a seguridad social.","La empresa cumple con la normativa de seguridad y salud en el trabajo (SG-SST)."],rec:"Formalizar todos los contratos, verificar las afiliaciones a seguridad social e implementar o actualizar el SG-SST."},
  {name:"Comercial",items:["La empresa formaliza por escrito sus acuerdos con clientes y proveedores.","La empresa cumple con la normativa de protección al consumidor."],rec:"Estandarizar los contratos con clientes y proveedores, y revisar el cumplimiento del Estatuto del Consumidor (Ley 1480 de 2011)."},
  {name:"Datos y propiedad intelectual",items:["La empresa cumple con la normativa de protección de datos personales (Ley 1581 de 2012).","La empresa protege su propiedad intelectual (marca registrada, derechos de autor, desarrollos propios)."],rec:"Adoptar una política de tratamiento de datos con autorizaciones conforme a la Ley 1581 de 2012 y registrar la marca ante la Superintendencia de Industria y Comercio."},
  {name:"Cumplimiento normativo",items:["La empresa se mantiene actualizada sobre los cambios normativos que afectan su sector.","La empresa identifica y gestiona de forma preventiva sus riesgos legales."],rec:"Asignar un responsable de monitoreo normativo y construir una matriz de riesgos legales con acciones preventivas."}
 ]}
];
// Numeración global de ítems
let n=0;
AREAS.forEach(a=>a.subs.forEach(s=>{s.nums=s.items.map(()=>++n)}));
const TOTAL=n;
const SCALE=["Totalmente en desacuerdo","En desacuerdo","Ni de acuerdo ni en desacuerdo","De acuerdo","Totalmente de acuerdo"];
const LEVELS=[
 {max:1.8,name:"Inicial",c:"--l1"},
 {max:2.6,name:"Básico",c:"--l2"},
 {max:3.4,name:"En desarrollo",c:"--l3"},
 {max:4.2,name:"Consolidado",c:"--l4"},
 {max:5.01,name:"Avanzado",c:"--l5"}
];
const PRINT_COLORS={"--l1":"#B3412F","--l2":"#CF7428","--l3":"#B8961A","--l4":"#4F9446","--l5":"#1D5C4D"};
function levelOf(s){return LEVELS.find(l=>s<l.max)||LEVELS[4]}
function levelIdx(s){return LEVELS.indexOf(levelOf(s))}

/* ---------- Estado ---------- */
const KEY="diag-pyme-v1";
const blank=()=>({view:"inicio",area:0,empresa:{nombre:"",nit:"",sector:"",tamano:"",ciudad:"",responsable:"",cargo:""},answers:{},noCE:false,fecha:null,ai:""});
let S=blank();
try{const raw=localStorage.getItem(KEY);if(raw){S=Object.assign(blank(),JSON.parse(raw))}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const app=document.getElementById("app");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=v=>v.toFixed(2).replace(".",",");
const areaActive=a=>!(a.optional&&S.noCE);

/* ---------- Cálculo ---------- */
function areaDone(a){if(!areaActive(a))return 1;let t=0,d=0;a.subs.forEach(s=>s.nums.forEach(k=>{t++;if(S.answers[k])d++}));return d/t}
function pendingNums(){const p=[];AREAS.forEach(a=>{if(!areaActive(a))return;a.subs.forEach(s=>s.nums.forEach(k=>{if(!S.answers[k])p.push(k)}))});return p}
function compute(){
 const areas=AREAS.filter(areaActive).map(a=>{
  const subs=a.subs.map(s=>({name:s.name,rec:s.rec,area:a.name,score:s.nums.reduce((t,k)=>t+S.answers[k],0)/s.nums.length}));
  return {id:a.id,name:a.name,short:a.short||a.name,subs,score:subs.reduce((t,s)=>t+s.score,0)/subs.length};
 });
 const global=areas.reduce((t,a)=>t+a.score,0)/areas.length;
 const allSubs=areas.flatMap(a=>a.subs);
 const fort=allSubs.filter(s=>s.score>=3.4).sort((x,y)=>y.score-x.score).slice(0,5);
 const debil=allSubs.filter(s=>s.score<2.6).sort((x,y)=>x.score-y.score);
 const plan=allSubs.filter(s=>s.score<3.4).sort((x,y)=>x.score-y.score).map(s=>({...s,prio:s.score<2.6?"Alta":"Media"}));
 const best=areas.slice().sort((x,y)=>y.score-x.score)[0];
 const worst=areas.slice().sort((x,y)=>x.score-y.score)[0];
 return {areas,global,fort,debil,plan,best,worst};
}
function summaryText(r){
 const lv=levelOf(r.global).name.toLowerCase();
 let t=`La empresa obtiene un puntaje global de ${fmt(r.global)} sobre 5, que corresponde a un nivel de madurez ${lv}. `;
 if(r.best.id!==r.worst.id) t+=`Su área más fuerte es ${r.best.name} (${fmt(r.best.score)}) y la que requiere más atención es ${r.worst.name} (${fmt(r.worst.score)}). `;
 t+= r.plan.length?`Se identificaron ${r.plan.length} sub-dimensiones por debajo del nivel consolidado, ${r.plan.filter(p=>p.prio==="Alta").length} de ellas con prioridad alta.`:`Todas las sub-dimensiones evaluadas alcanzan al menos el nivel consolidado.`;
 return t;
}

/* ---------- Radar ---------- */
function radarSVG(areas,colors){
 const W=380,H=330,cx=190,cy=168,R=110,nA=areas.length;
 const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/nA;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]};
 let g="";
 for(let lvl=1;lvl<=5;lvl++){
  const p=areas.map((_,i)=>pt(i,R*lvl/5).map(v=>v.toFixed(1)).join(",")).join(" ");
  g+=`<polygon points="${p}" fill="none" stroke="${colors.line}" stroke-width="1"/>`;
 }
 areas.forEach((a,i)=>{const [x,y]=pt(i,R);g+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${colors.line}"/>`});
 const poly=areas.map((a,i)=>pt(i,R*a.score/5).map(v=>v.toFixed(1)).join(",")).join(" ");
 g+=`<polygon points="${poly}" fill="${colors.fill}" fill-opacity=".22" stroke="${colors.fill}" stroke-width="2.5" stroke-linejoin="round"/>`;
 areas.forEach((a,i)=>{const [x,y]=pt(i,R*a.score/5);g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="${colors.fill}"/>`});
 areas.forEach((a,i)=>{
  const [x,y]=pt(i,R+26);const anchor=Math.abs(x-cx)<8?"middle":(x>cx?"start":"end");
  g+=`<text x="${x.toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="${anchor}" font-size="13" font-weight="700" fill="${colors.ink}" font-family="Source Sans 3, Segoe UI, sans-serif">${esc(a.short)}</text>`;
  g+=`<text x="${x.toFixed(1)}" y="${(y+12).toFixed(1)}" text-anchor="${anchor}" font-size="12.5" fill="${colors.muted}" font-family="Source Sans 3, Segoe UI, sans-serif">${fmt(a.score)}</text>`;
 });
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico radar de puntajes por área">${g}</svg>`;
}

let downloadsP=null;
function getCap(name){try{return (window.claude&&window.claude.use)?window.claude.use(name):Promise.resolve(null)}catch(e){return Promise.resolve(null)}}
async function offer(filename,data,mime,noteId){
 const note=document.getElementById(noteId||"dlnote");note.textContent="";
 if(!downloadsP)downloadsP=getCap("downloads");
 const dl=await downloadsP;
 if(dl){
  try{await dl.save({filename,data:typeof data==="string"?data:new Blob([data])});note.textContent="Archivo guardado."}
  catch(e){if(e&&e.code==="declined")return;note.textContent="No se pudo descargar el archivo. Intente de nuevo en unos segundos."}
  return;
 }
 try{const url=URL.createObjectURL(new Blob(typeof data==="string"?["\ufeff"+data]:[data],{type:mime+";charset=utf-8"}));const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
 catch(e){note.textContent="Este navegador no permitió la descarga."}
}
function csv(r){
 const q=v=>`"${String(v).replace(/"/g,'""')}"`;
 const rows=[["Empresa","NIT","Sector","Tamaño","Ciudad","Responsable","Cargo","Fecha"].map(q).join(";"),
  [S.empresa.nombre,S.empresa.nit,S.empresa.sector,S.empresa.tamano,S.empresa.ciudad,S.empresa.responsable,S.empresa.cargo,S.fecha||""].map(q).join(";"),"",
  ["Ítem","Área","Sub-dimensión","Afirmación","Respuesta","Significado"].map(q).join(";")];
 AREAS.forEach(a=>a.subs.forEach(s=>s.nums.forEach((k,j)=>{const v=areaActive(a)?S.answers[k]:"";rows.push([k,a.name,s.name,s.items[j],v||"N/A",v?SCALE[v-1]:"No aplica"].map(q).join(";"))})));
 rows.push("",["Área","Puntaje","Nivel"].map(q).join(";"));
 r.areas.forEach(a=>rows.push([a.name,fmt(a.score),levelOf(a.score).name].map(q).join(";")));
 rows.push([q("Global"),q(fmt(r.global)),q(levelOf(r.global).name)].join(";"));
 return rows.join("\r\n");
}
function buildPDF(r,fecha){
 const doc=new window.jspdf.jsPDF({unit:"mm",format:"letter"});
 const W=215.9,H=279.4,M=18,CW=W-2*M;let y=M;
 const rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
 const INK="#16221E",MUT="#58675F",PRI="#1D5C4D",LINE="#D3DCD7",SOFT="#E1EEE9";
 const col=s=>PRINT_COLORS[levelOf(s).c];
 const tc=h=>doc.setTextColor(...rgb(h));const fc=h=>doc.setFillColor(...rgb(h));const dc=h=>doc.setDrawColor(...rgb(h));
 const ensure=h=>{if(y+h>H-M-6){doc.addPage();y=M}};
 function para(str,o){o=o||{};const size=o.size||10,x=o.x||M,w=o.w||CW,lh=size*0.42+(o.lead||1.2);
  doc.setFont("helvetica",o.bold?"bold":"normal");doc.setFontSize(size);tc(o.color||INK);
  doc.splitTextToSize(String(str),w).forEach(l=>{ensure(lh);doc.text(l,x,y+size*0.35);y+=lh});y+=o.after||0}
 function h2(t){y+=4;ensure(16);doc.setFont("helvetica","bold");doc.setFontSize(13);tc(PRI);doc.text(t,M,y+4.5);y+=8;dc(LINE);doc.setLineWidth(.3);doc.line(M,y,W-M,y);y+=4}
 function bar(x,yy,w,h,s){fc(LINE);doc.roundedRect(x,yy,w,h,h/2,h/2,"F");fc(col(s));doc.roundedRect(x,yy,Math.max(h,w*s/5),h,h/2,h/2,"F")}

 // Encabezado
 fc(PRI);doc.rect(0,0,W,8,"F");y=16;
 para("Informe de diagnóstico empresarial",{size:10,color:MUT});
 para(S.empresa.nombre,{size:20,bold:true,after:1});
 const meta=[S.empresa.nit&&("NIT "+S.empresa.nit),S.empresa.sector,S.empresa.tamano,S.empresa.ciudad].filter(Boolean).join("  ·  ");
 if(meta)para(meta,{size:10,color:MUT});
 para("Fecha: "+fecha+(S.empresa.responsable?"   ·   Respondió: "+S.empresa.responsable+(S.empresa.cargo?" ("+S.empresa.cargo+")":""):""),{size:10,color:MUT,after:4});

 // Radar + puntaje global
 const top=y,cx=M+42,cy=top+40,R=28,nA=r.areas.length;
 const pt=(i,rad)=>{const a=-Math.PI/2+i*2*Math.PI/nA;return [cx+rad*Math.cos(a),cy+rad*Math.sin(a)]};
 dc(LINE);doc.setLineWidth(.25);
 for(let l=1;l<=5;l++){for(let i=0;i<nA;i++){const [x1,y1]=pt(i,R*l/5),[x2,y2]=pt((i+1)%nA,R*l/5);doc.line(x1,y1,x2,y2)}}
 for(let i=0;i<nA;i++){const [x,y2]=pt(i,R);doc.line(cx,cy,x,y2)}
 const P=r.areas.map((a,i)=>pt(i,R*a.score/5));
 fc(SOFT);dc(PRI);doc.setLineWidth(.7);
 doc.lines(P.slice(1).map((p,i)=>[p[0]-P[i][0],p[1]-P[i][1]]),P[0][0],P[0][1],[1,1],"FD",true);
 fc(PRI);P.forEach(p=>doc.circle(p[0],p[1],.9,"F"));
 doc.setFontSize(8);
 r.areas.forEach((a,i)=>{const [x,yy]=pt(i,R+6);const al=Math.abs(x-cx)<3?"center":(x>cx?"left":"right");
  doc.setFont("helvetica","bold");tc(INK);doc.text(a.short,x,yy-1,{align:al});doc.setFont("helvetica","normal");tc(MUT);doc.text(fmt(a.score),x,yy+2.6,{align:al})});
 const gx=M+95;let gy=top+14;
 doc.setFont("helvetica","normal");doc.setFontSize(10);tc(MUT);doc.text("Puntaje global",gx,gy);
 doc.setFont("helvetica","bold");doc.setFontSize(30);tc(INK);doc.text(fmt(r.global),gx,gy+12);
 doc.setFont("helvetica","normal");doc.setFontSize(11);tc(MUT);doc.text("de 5",gx+doc.getTextWidth(fmt(r.global))*30/11+3,gy+12);
 const lv=levelOf(r.global);doc.setFont("helvetica","bold");doc.setFontSize(10);
 const lt="Nivel "+lv.name.toLowerCase();const lw=doc.getTextWidth(lt)+8;fc(PRI);fc(PRINT_COLORS[lv.c]);doc.roundedRect(gx,gy+17,lw,7,3.5,3.5,"F");doc.setTextColor(255,255,255);doc.text(lt,gx+4,gy+21.8);
 const li=levelIdx(r.global),sw=(W-M-gx-8)/5;
 LEVELS.forEach((l,i)=>{fc(i<=li?PRINT_COLORS[l.c]:LINE);doc.rect(gx+i*(sw+2),gy+29,sw,2.5,"F");doc.setFont("helvetica","normal");doc.setFontSize(6.5);tc(MUT);doc.text(l.name,gx+i*(sw+2),gy+35)});
 y=top+84;
 para(summaryText(r),{size:10.5,after:2});

 // Áreas
 h2("Puntaje por área");
 r.areas.forEach(a=>{ensure(8);doc.setFont("helvetica","normal");doc.setFontSize(10.5);tc(INK);doc.text(a.name,M,y+4);bar(M+52,y+1.3,75,3.6,a.score);doc.setFont("helvetica","bold");doc.text(fmt(a.score),M+132,y+4);doc.setFont("helvetica","normal");tc(MUT);doc.text(levelOf(a.score).name,M+145,y+4);y+=8});
 if(S.noCE)para("Comercio exterior no aplica para esta empresa y se excluyó del cálculo.",{size:9,color:MUT});

 // Sub-dimensiones
 h2("Detalle por sub-dimensión");
 r.areas.forEach(a=>{ensure(14);para(a.name,{size:10.5,bold:true,after:.5});
  a.subs.forEach(s=>{ensure(6.5);doc.setFont("helvetica","normal");doc.setFontSize(9.5);tc(INK);doc.text(s.name,M+3,y+3.5);bar(M+62,y+1.2,60,2.8,s.score);doc.setFont("helvetica","bold");doc.text(fmt(s.score),M+127,y+3.5);doc.setFont("helvetica","normal");tc(MUT);doc.text(levelOf(s.score).name,M+140,y+3.5);y+=6.2});y+=2});

 // Fortalezas / debilidades
 h2("Fortalezas");
 if(r.fort.length)r.fort.forEach(s=>para("•  "+s.name+" ("+s.area+", "+fmt(s.score)+")",{size:10}));else para("Ninguna sub-dimensión alcanza todavía el nivel consolidado (3,40 o más).",{size:10,color:MUT});
 h2("Debilidades críticas");
 if(r.debil.length)r.debil.forEach(s=>para("•  "+s.name+" ("+s.area+", "+fmt(s.score)+")",{size:10}));else para("No hay sub-dimensiones por debajo de 2,60.",{size:10,color:MUT});

 // Plan
 h2("Plan de acción priorizado");
 if(!r.plan.length)para("Todas las sub-dimensiones están en nivel consolidado o avanzado. Se recomienda mantener la medición y repetir el diagnóstico en seis meses.",{size:10});
 r.plan.forEach(p=>{doc.setFontSize(9.5);const lines=doc.splitTextToSize(p.rec,CW-8);const hh=9+lines.length*4.3;ensure(hh+3);
  fc("#F4F7F5");doc.rect(M,y,CW,hh,"F");fc(col(p.score));doc.rect(M,y,1.6,hh,"F");
  doc.setFont("helvetica","bold");doc.setFontSize(10);tc(INK);doc.text(p.area+": "+p.name,M+5,y+5.5);
  doc.setFont("helvetica","normal");doc.setFontSize(9);tc(MUT);doc.text("Prioridad "+p.prio.toLowerCase()+"  ·  "+fmt(p.score),W-M-3,y+5.5,{align:"right"});
  doc.setFontSize(9.5);tc(INK);lines.forEach((l,i)=>doc.text(l,M+5,y+10.5+i*4.3));y+=hh+3});

 if(S.ai){h2("Análisis narrativo");para(S.ai,{size:10})}

 // Respuestas
 h2("Respuestas registradas");
 AREAS.forEach(a=>{ensure(12);para(a.name+(areaActive(a)?"":" (no aplica)"),{size:10.5,bold:true,after:.5});
  a.subs.forEach(s=>s.nums.forEach((k,j)=>{const v=areaActive(a)?S.answers[k]:null;
   doc.setFontSize(9);const lines=doc.splitTextToSize(k+". "+s.items[j],CW-52);const hh=lines.length*3.9+1.8;ensure(hh);
   doc.setFont("helvetica","normal");tc(INK);lines.forEach((l,i)=>doc.text(l,M+3,y+3.2+i*3.9));
   doc.setFont("helvetica","bold");tc(v?col(v):MUT);doc.text(v?(v+"  "+SCALE[v-1]):"N/A",W-M,y+3.2,{align:"right"});
   y+=hh}));y+=2});

 h2("Escala utilizada");
 para("Respuestas en escala Likert de 1 (totalmente en desacuerdo) a 5 (totalmente de acuerdo). Niveles de madurez: Inicial, menos de 1,80; Básico, 1,80 a 2,59; En desarrollo, 2,60 a 3,39; Consolidado, 3,40 a 4,19; Avanzado, 4,20 a 5,00.",{size:9,color:MUT});

 const np=doc.getNumberOfPages();
 for(let i=1;i<=np;i++){doc.setPage(i);doc.setFont("helvetica","normal");doc.setFontSize(8);tc(MUT);doc.text("Diagnóstico empresarial  ·  "+S.empresa.nombre,M,H-9);doc.text("Página "+i+" de "+np,W-M,H-9,{align:"right"})}
 return doc.output("arraybuffer");
}

/* ---------- Análisis con IA (opcional) ---------- */
let sampleP=null;
async function setupAI(r){
 if(!sampleP)sampleP=getCap("sample");
 const sample=await sampleP;
 const block=document.getElementById("aiblock");
 if(!sample||!block)return;
 block.hidden=false;
 const btn=document.getElementById("aibtn"),stop=document.getElementById("aistop"),out=document.getElementById("aiout"),note=document.getElementById("ainote");
 let ctl=null;
 stop.onclick=()=>ctl&&ctl.abort();
 btn.onclick=async()=>{
  const low=[];AREAS.forEach(a=>{if(!areaActive(a))return;a.subs.forEach(s=>s.nums.forEach((k,j)=>{if(S.answers[k]<=2)low.push(`- (${a.name}) ${s.items[j]} → ${S.answers[k]}`)}))});
  const data=`Empresa: ${S.empresa.nombre}\nSector: ${S.empresa.sector}\nTamaño: ${S.empresa.tamano}\nCiudad: ${S.empresa.ciudad||"no indicada"}\nPuntaje global: ${fmt(r.global)} / 5 (nivel ${levelOf(r.global).name})\n\nPuntajes por área y sub-dimensión (escala 1 a 5):\n`+r.areas.map(a=>`${a.name}: ${fmt(a.score)}\n`+a.subs.map(s=>`  - ${s.name}: ${fmt(s.score)}`).join("\n")).join("\n")+(S.noCE?"\nComercio exterior: no aplica.":"")+`\n\nAfirmaciones con respuesta 1 o 2:\n${low.join("\n")||"ninguna"}`;
  const prompt=`Eres consultor empresarial de pymes en Colombia. Con base en los resultados de un diagnóstico organizacional (escala Likert de 1 a 5, niveles: Inicial <1,8; Básico <2,6; En desarrollo <3,4; Consolidado <4,2; Avanzado ≥4,2), redacta en español un análisis ejecutivo en texto plano, sin markdown, sin asteriscos ni almohadillas, con esta estructura:\n\nSituación general (un párrafo).\nFortalezas (un párrafo).\nPrincipales brechas y sus posibles efectos en el negocio (un párrafo).\nTres prioridades para los próximos seis meses (numeradas 1., 2., 3., una línea cada una, concretas y realistas para una empresa de este tamaño y sector).\n\nNo inventes datos que no estén en los resultados. Máximo 350 palabras.\n\nRESULTADOS:\n${data}`;
  ctl=new AbortController();btn.disabled=true;stop.hidden=false;note.textContent="";out.textContent="Analizando los resultados…";
  try{
   const res=await sample(prompt,{signal:ctl.signal,onText:({text})=>{out.textContent=text}});
   out.textContent=res.text;S.ai=res.text;save();
   if(res.truncated)note.textContent="El análisis quedó incompleto; puede generarlo de nuevo.";
  }catch(e){
   out.textContent=(e&&e.text)||S.ai||"";
   const code=e&&e.code;
   if(code==="not_granted"){block.hidden=true}
   else if(code==="cancelled"){note.textContent="Análisis detenido."}
   else if(code==="rate_limited"){note.textContent="Hay demasiadas solicitudes en curso. Espere un momento y vuelva a intentarlo."}
   else note.textContent="No se pudo generar el análisis. Intente de nuevo más tarde.";
  }finally{btn.disabled=false;stop.hidden=true;btn.textContent="Volver a generar análisis"}
 };
}

render();
})();
</script>
